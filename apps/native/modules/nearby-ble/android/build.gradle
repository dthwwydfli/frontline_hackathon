plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nearbyble'
version = '0.1.0'

android {
  namespace "expo.modules.nearbyble"
  defaultConfig {
    // BLE peripheral mode (BluetoothLeAdvertiser + BluetoothGattServer) needs
    // API 21, but the Nearby Devices permission model and the compat paths
    // here are only exercised from 26 up.
    minSdkVersion 26
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
